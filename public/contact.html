  <!-- Contact Form -->
  <div class="section-label" data-i18n="contact.sections.form"></div>
  <div class="form-card">
    <div class="field">
      <input type="text" id="f-name" placeholder="" data-i18n-placeholder="contact.form.namePlaceholder" />
    </div>
    <div class="field">
      <input type="email" id="f-email" placeholder="" data-i18n-placeholder="contact.form.emailPlaceholder" />
    </div>
    <div class="field">
      <select id="f-category" aria-label="Topic" data-i18n-aria-label="contact.form.topicAria">
        <option value="support" data-i18n="contact.form.topicSupport"></option>
        <option value="cx" data-i18n="contact.form.topicCx"></option>
      </select>
    </div>
    <div class="field">
      <input type="text" id="f-subject" placeholder="" data-i18n-placeholder="contact.form.subjectPlaceholder" />
    </div>
    <div class="field">
      <textarea id="f-message" placeholder="" data-i18n-placeholder="contact.form.messagePlaceholder"></textarea>
    </div>
    <button class="submit-btn" id="submitBtn" data-i18n="contact.form.submit"></button>
    <div id="formStatus" class="form-status"></div>
    <div class="direct-contact" style="margin-top:14px">
      <span data-i18n="contact.form.directPrefix"></span> <a id="directContactLink" href="mailto:support_forge@skia.ca">support_forge@skia.ca</a>

      <span class="sep">|</span>
      <a href="/contact" data-i18n="common.footer.contactSupport"></a>
    </div>
  </footer>
</div>

<script>
  // Sidebar
  (function(){
    const sidebar=document.getElementById('pcSidebar');
    const tab=document.getElementById('pcSidebarTab');
    const backdrop=document.getElementById('pcSidebarBackdrop');
    if(!sidebar||!tab||!backdrop)return;
    const open=()=>{sidebar.classList.add('pc-sidebar--open');backdrop.style.display='block';};
    const close=()=>{sidebar.classList.remove('pc-sidebar--open');backdrop.style.display='none';};
    tab.addEventListener('click',open);
    backdrop.addEventListener('click',close);
    sidebar.addEventListener('click',e=>{if(e.target.tagName==='A')close();});
  })();

  // Keep the visible "reach us directly" email in sync with the Topic dropdown.
  (function(){
    const select = document.getElementById('f-category');
    const link   = document.getElementById('directContactLink');
    if(!select||!link) return;
    const update = function(){
      const addr = select.value === 'cx' ? 'cx_forge@skia.ca' : 'support_forge@skia.ca';
      link.textContent = addr;
      link.setAttribute('href','mailto:' + addr);
    };
    select.addEventListener('change', update);
    update();
  })();

  // Form submit
  document.getElementById('submitBtn').addEventListener('click', async function(){
    const name     = document.getElementById('f-name').value.trim();
    const email    = document.getElementById('f-email').value.trim();
    const subject  = document.getElementById('f-subject').value.trim();
    const message  = document.getElementById('f-message').value.trim();
    const category = (document.getElementById('f-category').value === 'cx') ? 'cx' : 'support';
    const fallback = category === 'cx' ? 'cx_forge@skia.ca' : 'support_forge@skia.ca';
    const status   = document.getElementById('formStatus');
    const btn      = this;

    if(!name||!email||!subject||!message){
      status.className='form-status error';
      status.textContent=(window.__forgeContactI18n&&window.__forgeContactI18n.fillAll)||'Please fill in all fields.';
      return;
    }

    btn.disabled=true;
    btn.textContent=(window.__forgeContactI18n&&window.__forgeContactI18n.sending)||'Sending...';
    status.textContent='';

    try {
      const res = await fetch('/api/auth/contact', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name,email,subject,message,category,source:'forge'})
      });
      if(!res.ok) throw new Error('Failed');
      status.className='form-status success';
      status.textContent=(window.__forgeContactI18n&&window.__forgeContactI18n.success)||"Message sent.";
      document.getElementById('f-subject').value='';
      document.getElementById('f-message').value='';
    } catch {
      status.className='form-status error';
      status.textContent=((window.__forgeContactI18n&&window.__forgeContactI18n.failedPrefix)||'Failed to send. Please email us at ')+fallback;
    } finally {
      btn.disabled=false;
      btn.textContent=(window.__forgeContactI18n&&window.__forgeContactI18n.submit)||'Send Message';
    }
  });
</script>
  <script src="/forge-page-locale.js" defer></script>
  <script src="/forge-sidebar-locale.js" defer></script>
