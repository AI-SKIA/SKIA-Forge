    :root {
      --forge-font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --forge-font-heading: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --gold: #d4af37;
      --gold-muted: rgba(212,175,55,0.62);
      --gold-dim: rgba(212,175,55,0.25);
      --bg: #080400;
      --card-bg: linear-gradient(135deg, rgba(15,8,0,0.95) 0%, rgba(25,14,0,0.95) 100%);
      --border: rgba(212,175,55,0.3);
      --text-soft: rgba(255,255,255,0.68);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,180,0,0.06) 0%, transparent 70%), var(--bg);
      color: var(--gold);
      font-family: var(--forge-font-sans);
      min-height: 100vh;
    }
    .pc-sidebar-backdrop { position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(2px);z-index:199;cursor:pointer;display:none; }
    .pc-sidebar-tab { position:fixed;top:50%;left:0;transform:translateY(-50%);z-index:200;display:flex;align-items:center;justify-content:center;width:36px;height:72px;background:linear-gradient(180deg,rgba(20,10,0,0.95) 0%,rgba(40,20,0,0.98) 50%,rgba(20,10,0,0.95) 100%);border:1px solid rgba(212,175,55,0.4);border-left:none;border-radius:0 10px 10px 0;cursor:pointer;box-shadow:4px 0 20px rgba(212,175,55,0.15); }
    .pc-sidebar-tab-icon { font-size:20px;color:var(--gold); }
    .pc-sidebar { position:fixed;top:0;left:0;width:260px;height:100vh;background:linear-gradient(180deg,rgba(12,6,0,0.98) 0%,rgba(20,10,0,0.99) 100%);border-right:1px solid rgba(212,175,55,0.25);z-index:201;transform:translateX(-100%);transition:transform 0.25s ease;display:flex;flex-direction:column;padding:24px 0 32px; }
    .pc-sidebar--open { transform:translateX(0); }
    .pc-sidebar-logo { display:flex;flex-direction:column;align-items:center;padding:0 20px 20px; }
    .pc-sidebar-logo-img { width:56px;height:56px;border-radius:50%;object-fit:cover; }
    .pc-sidebar-logo-tagline { font-size:10px;color:rgba(212,175,55,0.55);letter-spacing:0.12em;margin-top:8px;text-transform:uppercase; }
    .pc-sidebar-divider { height:1px;background:rgba(212,175,55,0.18);margin:8px 16px; }
    .pc-sidebar-nav { display:flex;flex-direction:column;gap:2px;padding:8px 12px; }
    .pc-sidebar-btn { display:block;padding:10px 14px;border-radius:6px;color:rgba(212,175,55,0.85);text-decoration:none;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;transition:background 0.15s,color 0.15s;border:1px solid transparent; }
    .pc-sidebar-btn:hover { background:rgba(212,175,55,0.1);color:#d4af37; }
    .pc-sidebar-btn--active { background:rgba(212,175,55,0.1);border-color:rgba(212,175,55,0.25);color:#d4af37; }
    .back-btn { position:fixed;top:24px;left:24px;z-index:100;display:flex;align-items:center;gap:8px;color:var(--gold);text-decoration:none;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;border:1px solid var(--border);border-radius:6px;padding:8px 14px;background:rgba(0,0,0,0.55);transition:background 0.15s; }
    .back-btn:hover { background:rgba(212,175,55,0.08); }
    button.back-btn { appearance:none;-webkit-appearance:none;font:inherit;color:inherit;cursor:pointer; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 80px 24px 72px; }
    .feature-page-header { text-align:center; margin-top: 24px; margin-bottom: 8px; }
    .page-title { font-size:28px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px; }
    .page-subtitle { font-size:13px;color:var(--text-soft);letter-spacing:0.05em;font-family:var(--forge-font-sans);max-width:560px;margin:0 auto;line-height:1.6; }
    .feature-tab {
      display:inline-block; padding:8px 18px; border-radius:6px; border:1px solid rgba(212,175,55,0.2); background:transparent;
      color:rgba(212,175,55,0.7); font-family:'Orbitron',var(--forge-font-heading),sans-serif; font-size:10px; font-weight:400;
      letter-spacing:1.5px; text-transform:uppercase; text-decoration:none; cursor:pointer; transition:all 0.2s ease;
    }
    .feature-tab:hover { border-color:rgba(212,175,55,0.4); color:rgba(212,175,55,0.7); }
    .feature-tab--active { border-color:rgba(212,175,55,0.7); background:rgba(212,175,55,0.08); color:rgba(212,175,55,0.7); }
    .download-web-option { margin-top:14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap; }
    .download-web-text { margin:0;color:rgba(255,255,255,0.72);font-size:13px;text-align:center; }
    .download-instructions {
      margin:16px auto 0; width:100%; max-width:980px; border:1px solid rgba(212,175,55,0.2); border-radius:12px;
      background:rgba(0,0,0,0.28); padding:12px; display:grid; gap:8px;
    }
    .download-instruction-row { display:flex; align-items:center; gap:10px; color:rgba(255,255,255,0.85); font-size:14px; }
    .download-step {
      width:22px;height:22px;border-radius:999px;border:1px solid rgba(212,175,55,0.4);color:rgba(212,175,55,0.7);
      display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto;
    }
    .doc-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:24px;margin-bottom:12px; }
    .doc-card {
      background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:20px 18px;text-decoration:none;color:var(--gold);
      transition:border-color 0.15s,background 0.15s;display:flex;flex-direction:column;gap:6px;
    }
    a.doc-card:hover { border-color:rgba(212,175,55,0.7);background:linear-gradient(135deg,rgba(20,10,0,0.98) 0%,rgba(35,18,0,0.98) 100%); }
    .doc-card--panel { cursor:default; pointer-events:none; }
    .doc-card-title { font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600; }
    .doc-card-sub { font-size:10px;color:var(--gold-muted);letter-spacing:0.08em;text-transform:uppercase; }
    .doc-card-desc { font-size:12px;color:var(--text-soft);line-height:1.5; }
    .doc-card-arrow { align-self:flex-end;font-size:14px;color:rgba(212,175,55,0.55);margin-top:4px; }
    .platform-downloads-installer-hint { display:block;font-size:11px;color:rgba(255,255,255,0.45);margin-top:6px; }
    footer { margin-top:60px;text-align:center;font-family:var(--forge-font-sans);font-size:15px;line-height:1.8; }
    .footer-tagline { color:var(--gold);font-size:16px;margin-bottom:4px; }
    .footer-copy { color:var(--gold-muted); }
    .footer-links { display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:14px; }
    .footer-links a { color:var(--gold);text-decoration:none; }
    .footer-links a:hover { text-decoration:underline; }
    .footer-links .sep { color:rgba(212,175,55,0.35); }
    @media(max-width:680px){.wrap{padding:70px 16px 48px;}.page-title{font-size:22px;}.pc-sidebar,.pc-sidebar-tab,.pc-sidebar-backdrop{display:none!important;}}
    body { letter-spacing: 0.01em; line-height: 1.6; }
    h1, h2, h3 { font-family:var(--forge-font-heading); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; line-height: 1.15; }
  </style>

<script>
  (function(){
    const sidebar=document.getElementById('pcSidebar');
    const tab=document.getElementById('pcSidebarTab');
    const backdrop=document.getElementById('pcSidebarBackdrop');
    if(!sidebar||!tab||!backdrop)return;
    const open=()=>{sidebar.classList.add('pc-sidebar--open');backdrop.style.display='block';};
    const close=()=>{sidebar.classList.remove('pc-sidebar--open');backdrop.style.display='none';};
    tab.addEventListener('click',open);
    backdrop.addEventListener('click',close);
    sidebar.addEventListener('click',e=>{if(e.target.tagName==='A')close();});
  })();
</script>
