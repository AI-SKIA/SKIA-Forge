<script>
(function(){
  var sidebar=document.getElementById('pcSidebar');
  var tab=document.getElementById('pcSidebarTab');
  var backdrop=document.getElementById('pcSidebarBackdrop');
  if(!sidebar||!tab||!backdrop)return;
  var open=function(){sidebar.classList.add('pc-sidebar--open');backdrop.style.display='block';};
  var close=function(){sidebar.classList.remove('pc-sidebar--open');backdrop.style.display='none';};
  tab.addEventListener('click',open);
  backdrop.addEventListener('click',close);
  sidebar.addEventListener('click',function(e){if(e.target.tagName==='A')close();});
})();
</script>
