    <script>
  (function(){
    const sidebar=document.getElementById('pcSidebar');
    const tab=document.getElementById('pcSidebarTab');
    const backdrop=document.getElementById('pcSidebarBackdrop');
    if(!sidebar||!tab||!backdrop)return;
    const open=()=>{sidebar.classList.add('pc-sidebar--open');backdrop.style.display='block';};
    const close=()=>{sidebar.classList.remove('pc-sidebar--open');backdrop.style.display='none';};
    tab.addEventListener('click',open);
    backdrop.addEventListener('click',close);
    sidebar.addEventListener('click',e=>{if(e.target.tagName==='A')close();});
  })();
    </script>
