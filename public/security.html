<html lang="en" class="skia-scrollbar-premium">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title data-i18n="security.meta.title"></title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/forge-lucide-icons.css" />
  <style>

    :root {
      --forge-font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --forge-font-heading: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --gold: #d4af37;
      --gold-muted: rgba(212,175,55,0.62);
      --gold-dim: rgba(212,175,55,0.25);
      --bg: #080400;
      --card-bg: linear-gradient(135deg,rgba(15,8,0,0.95) 0%,rgba(25,14,0,0.95) 100%);
      --border: rgba(212,175,55,0.3);
      --text-soft: rgba(255,255,255,0.68);
      --text-dim: rgba(255,255,255,0.38);
    }

    * { box-sizing:border-box;margin:0;padding:0; }

    body {
      background: radial-gradient(ellipse 80% 60% at 50% 0%,rgba(255,180,0,0.06) 0%,transparent 70%), var(--bg);
      color: var(--gold);
      font-family:var(--forge-font-sans);
      min-height: 100vh;
    }

    .pc-sidebar-backdrop { position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(2px);z-index:199;cursor:pointer;display:none; }
    .pc-sidebar-tab { position:fixed;top:50%;left:0;transform:translateY(-50%);z-index:200;display:flex;align-items:center;justify-content:center;width:36px;height:72px;background:linear-gradient(180deg,rgba(20,10,0,0.95) 0%,rgba(40,20,0,0.98) 50%,rgba(20,10,0,0.95) 100%);border:1px solid rgba(212,175,55,0.4);border-left:none;border-radius:0 10px 10px 0;cursor:pointer;box-shadow:4px 0 20px rgba(212,175,55,0.15); }
    .pc-sidebar-tab-icon { font-size:20px;color:var(--gold); }
    .pc-sidebar { position:fixed;top:0;left:0;width:260px;height:100vh;background:linear-gradient(180deg,rgba(12,6,0,0.98) 0%,rgba(20,10,0,0.99) 100%);border-right:1px solid rgba(212,175,55,0.25);z-index:201;transform:translateX(-100%);transition:transform 0.25s ease;display:flex;flex-direction:column;padding:24px 0 32px; }
    .pc-sidebar--open { transform:translateX(0); }
    .pc-sidebar-logo { display:flex;flex-direction:column;align-items:center;padding:0 20px 20px; }
    .pc-sidebar-logo-img { width:56px;height:56px;border-radius:50%;object-fit:cover; }
    .pc-sidebar-logo-tagline { font-size:10px;color:rgba(212,175,55,0.55);letter-spacing:0.12em;margin-top:8px;text-transform:uppercase; }
    .pc-sidebar-divider { height:1px;background:rgba(212,175,55,0.18);margin:8px 16px; }
    .pc-sidebar-nav { display:flex;flex-direction:column;gap:2px;padding:8px 12px; }
    .pc-sidebar-btn { display:block;padding:10px 14px;border-radius:6px;color:rgba(212,175,55,0.85);text-decoration:none;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;transition:background 0.15s,color 0.15s; }
    .pc-sidebar-btn:hover { background:rgba(212,175,55,0.1);color:#d4af37; }

    .back-btn { position:fixed;top:24px;left:24px;z-index:100;display:flex;align-items:center;gap:8px;color:var(--gold);text-decoration:none;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;border:1px solid var(--border);border-radius:6px;padding:8px 14px;background:rgba(0,0,0,0.55);transition:background 0.15s; }
    .back-btn:hover { background:rgba(212,175,55,0.08); }
    button.back-btn { appearance:none;-webkit-appearance:none;font:inherit;color:inherit;cursor:pointer; }

    .wrap { max-width:860px;margin:0 auto;padding:80px 24px 72px; }

    .page-header { text-align:center;margin-bottom:48px; }
    .page-title { font-size:30px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px; }
    .page-subtitle { font-size:13px;color:var(--text-soft);letter-spacing:0.05em;font-family:var(--forge-font-sans); }

    .section-label { font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border); }

    .section-block { margin-bottom:40px; }

    /* Layered controls */
    .controls-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:0; }
    .control-card { background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:18px 16px;display:flex;gap:12px;align-items:flex-start; }
    .control-icon { flex-shrink:0;margin-top:2px;display:flex;align-items:flex-start; }
    .control-title { font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px; }
    .control-desc { font-size:12px;color:var(--text-soft);font-family:var(--forge-font-sans);line-height:1.5; }

    /* Key components */
    .kc-list { display:flex;flex-direction:column;gap:10px; }
    .kc-item { background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start; }
    .kc-bullet { width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:6px; }
    .kc-text { font-size:12px;color:var(--text-soft);font-family:var(--forge-font-sans);line-height:1.55; }
    .kc-text strong { color:var(--gold);font-family:var(--forge-font-sans);font-size:11px;letter-spacing:0.06em; }

    /* Practices */
    .practice-list { display:flex;flex-direction:column;gap:8px; }
    .practice-item { display:flex;gap:12px;align-items:flex-start;padding:12px 16px;background:rgba(212,175,55,0.04);border:1px solid rgba(212,175,55,0.18);border-radius:8px; }
    .practice-num { font-size:10px;font-weight:700;color:var(--gold);letter-spacing:0.1em;min-width:20px;margin-top:1px; }
    .practice-text { font-size:12px;color:var(--text-soft);font-family:var(--forge-font-sans);line-height:1.5; }

    /* Checklist */
    .checklist { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
    .check-item { display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:rgba(212,175,55,0.04);border:1px solid rgba(212,175,55,0.18);border-radius:8px; }
    .check-icon { color:var(--gold);flex-shrink:0;margin-top:1px;display:flex;align-items:center; }
    .check-text { font-size:12px;color:var(--text-soft);font-family:var(--forge-font-sans);line-height:1.5; }

    /* Reporting banner */
    .report-banner { background:var(--card-bg);border:1px solid rgba(212,175,55,0.45);border-radius:12px;padding:28px 24px;text-align:center;margin-bottom:48px; }
    .report-banner h3 { font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px; }
    .report-banner p { font-size:13px;color:var(--text-soft);font-family:var(--forge-font-sans);line-height:1.6;margin-bottom:16px; }
    .report-btn { display:inline-block;padding:10px 24px;border:1px solid var(--gold);border-radius:6px;color:var(--gold);text-decoration:none;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;background:rgba(212,175,55,0.08);transition:background 0.15s; }
    .report-btn:hover { background:rgba(212,175,55,0.18); }

    footer { margin-top:60px;text-align:center;font-family:var(--forge-font-sans);font-size:12px;line-height:1.8; }
    .footer-tagline { color:var(--gold);font-size:13px;margin-bottom:4px; }
    .footer-copy { color:var(--gold-muted); }
    .footer-links { display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px; }
    .footer-links a { color:var(--gold);text-decoration:none; }
    .footer-links a:hover { text-decoration:underline; }
    .footer-links .sep { color:rgba(212,175,55,0.35); }

    @media(max-width:680px){ .wrap{padding:70px 16px 48px;} .page-title{font-size:22px;} .checklist{grid-template-columns:1fr;} }
/* SKIA typography normalization */
body {
  font-family:var(--forge-font-sans) !important;
  letter-spacing: 0.01em !important;
  line-height: 1.6 !important;
}
h1, h2, h3, h4, h5, h6, button, .btn, .title, .heading, .label, .badge {
  font-family:var(--forge-font-heading) !important;
  letter-spacing: 0.08em !important;
  text-transform: uppercase;
  font-weight: 600 !important;
  line-height: 1.15 !important;
}
</style>

<script>
  (function(){
    const sidebar=document.getElementById('pcSidebar');
    const tab=document.getElementById('pcSidebarTab');
    const backdrop=document.getElementById('pcSidebarBackdrop');
    if(!sidebar||!tab||!backdrop)return;
    const open=()=>{sidebar.classList.add('pc-sidebar--open');backdrop.style.display='block';};
    const close=()=>{sidebar.classList.remove('pc-sidebar--open');backdrop.style.display='none';};
    tab.addEventListener('click',open);
    backdrop.addEventListener('click',close);
    sidebar.addEventListener('click',e=>{if(e.target.tagName==='A')close();});
  })();
</script>
